plugins {
    id 'ata-curriculum.snippets-conventions'
    id 'ata-curriculum.integration-test-conventions'
    id 'io.spring.dependency-management' version '1.1.4'
}
configurations {
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        // The ata-curriculum java-conventions plugin pins JUnit to 5.6.0, which is incompatible
        // with Spring Boot 3.2.5's SpringExtension. Force the BOM-managed version.
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.junit.jupiter') {
                details.useVersion '5.10.2'
            }
            if (details.requested.group == 'org.junit.platform') {
                details.useVersion '1.10.2'
            }
        }
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.5'
        mavenBom 'software.amazon.awssdk:bom:2.25.23'
    }
}

dependencies {
    implementation project(":Application")
    testImplementation('org.springframework.boot:spring-boot-starter-web')
    testImplementation('org.springframework.boot:spring-boot-starter-test')

    testImplementation group: 'org.testcontainers', name: 'testcontainers', version: '1.16.3'
    testImplementation 'software.amazon.awssdk:dynamodb:2.25.23'
    testImplementation group: 'org.skyscreamer', name: 'jsonassert', version: '1.5.0'
    testImplementation 'net.andreinc:mockneat:0.4.7'

    testImplementation 'io.micrometer:micrometer-core'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'



    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

task buildZip(type: Zip) {
    from compileJava
    from processResources
    into('lib') {
        from configurations.runtimeClasspath
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

build.dependsOn buildZip

def wflowToTestsMap = [
        'run-integration-tests': [
                'com.kenzie.appserver.controller.*',
        ]
]

wflowToTestsMap.forEach { wflowName, testList ->
    tasks.register(wflowName) {
        dependsOn wflowtest
        test {
            reports.html.destination = file("$reports.html.destination/../${wflowName}")
            reports.junitXml.destination = file("$reports.junitXml.destination/${wflowName}")
            doFirst {
                filter {
                    testList.each { includeTestsMatching it }
                }
            }
        }
    }
}
